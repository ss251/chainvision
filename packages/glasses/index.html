<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChainVision · Even G2 Companion</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b09;
        --card: #101713;
        --border: #203326;
        --green: #4ade80;
        --dim: #86a392;
        --text: #e8f5ec;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: var(--bg);
        color: var(--text);
        padding: 16px;
      }
      .banner {
        border: 1px solid var(--border);
        background: var(--card);
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 12px;
      }
      .title { color: var(--green); font-weight: 700; font-size: 16px; margin: 0 0 4px; }
      .sub { color: var(--dim); font-size: 12px; margin: 0; }
      .code-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px dashed var(--green);
        padding: 10px 12px;
        border-radius: 8px;
        margin: 10px 0;
      }
      .code { font-size: 22px; letter-spacing: 4px; color: var(--green); font-weight: 700; }
      button {
        background: #173122;
        color: var(--green);
        border: 1px solid var(--green);
        border-radius: 6px;
        padding: 8px 12px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      input {
        width: 100%;
        background: #0b110d;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        font-family: inherit;
        font-size: 12px;
        margin-bottom: 8px;
      }
      pre {
        background: #0b110d;
        border: 1px solid var(--border);
        padding: 10px;
        border-radius: 6px;
        font-size: 11px;
        overflow-x: auto;
        white-space: pre-wrap;
        color: #b7e4c7;
      }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <div class="banner">
      <p class="title">CHAINVISION · EVEN G2 HUD</p>
      <p class="sub">Testnet only (Sepolia + Hyperliquid Testnet) · Non-custodial · Not financial advice</p>
    </div>

    <div class="banner">
      <p class="sub">GLASSES PAIRING CODE (enter in Telegram Mini App or /pair &lt;code&gt;)</p>
      <div class="code-box">
        <span id="pair-code" class="code">------</span>
        <button id="copy-code" type="button">Copy Code</button>
      </div>
      <p id="conn-status" class="sub">Connecting to backend...</p>
    </div>

    <div class="banner">
      <p class="sub">SIMULATOR QUICK CONTROLS (mirrors temple gestures)</p>
      <div class="row" style="margin: 8px 0">
        <button id="btn-sync" type="button">Sync Testnets</button>
        <button id="btn-positions" type="button">Show Positions</button>
        <button id="btn-brief" type="button">What Matters?</button>
        <button id="btn-blank" type="button">Blank Screen</button>
      </div>
      <input id="voice-input" placeholder='Test voice phrase: "put 200 USDC to work"' />
      <button id="btn-voice" type="button">Send Voice Phrase</button>
    </div>

    <div class="banner">
      <p class="sub">LIVE LENS STATE</p>
      <pre id="lens-preview">Loading...</pre>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
